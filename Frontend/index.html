<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AXIOM — AI Chatbot</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="index.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
</head>
<body>
  <aside class="sidebar" aria-label="Navigation sidebar">
    <div class="logo">
      <span class="logo-icon" aria-hidden="true">◆</span>
      <h1>AXIOM</h1>
    </div>
    <nav class="sidebar-nav" aria-label="Sidebar actions">
      <button id="newChatBtn" class="nav-btn" aria-label="Start a new chat" title="New Chat">
        <span aria-hidden="true">+</span> New Chat
      </button>
      <button id="clearBtn" class="nav-btn" aria-label="Clear conversation" title="Clear Conversation">
        <span aria-hidden="true">✕</span> Clear
      </button>
    </nav>
    <footer class="sidebar-footer">
      <p>Phase 1 — Vanilla JS</p>
    </footer>
  </aside>

  <main class="main" id="mainArea">
    <header class="chat-header">
      <h2>Hello, I'm AXIOM. How can I help you?</h2>
    </header>

    <section class="chat-window" id="chatWindow" aria-live="polite" aria-label="Chat messages">
    </section>

    <form class="input-area" id="chatForm" aria-label="Message input form" onsubmit="event.preventDefault();">
      <textarea
        id="messageInput"
        class="message-input"
        rows="1"
        placeholder="Type your message..."
        aria-label="Type a message"
        autocomplete="off"
      ></textarea>
      <button type="submit" id="sendBtn" class="send-btn" aria-label="Send message" title="Send">
        <span aria-hidden="true">→</span>
      </button>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
