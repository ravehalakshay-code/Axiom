<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AXIOM — AI Chatbot</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Fraunces:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
</head>
<body>
  <aside class="sidebar" aria-label="Navigation sidebar">
    <div class="logo">
      <span class="logo-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="28" height="28">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </span>
      <h1>AXIOM</h1>
    </div>
    <nav class="sidebar-nav" aria-label="Sidebar actions">
      <button id="newChatBtn" class="nav-btn" aria-label="Start a new chat" title="New Chat">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </span>
        New Chat
      </button>
      <button id="clearBtn" class="nav-btn" aria-label="Clear conversation" title="Clear Conversation">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
        </span>
        Clear
      </button>
    </nav>
    <footer class="sidebar-footer">
      <p>Phase 1 — Vanilla JS</p>
    </footer>
  </aside>

  <main class="main" id="mainArea">
    <header class="chat-header">
      <h2>Hello, I'm AXIOM. How can I help you?</h2>
      <span class="status-dot" aria-hidden="true"></span>
    </header>

    <section class="chat-window" id="chatWindow" aria-live="polite" aria-label="Chat messages">
    </section>

    <form class="input-area" id="chatForm" aria-label="Message input form" onsubmit="event.preventDefault();">
      <textarea
        id="messageInput"
        class="message-input"
        rows="1"
        placeholder="Type your message..."
        aria-label="Type a message"
        autocomplete="off"
      ></textarea>
      <button type="submit" id="sendBtn" class="send-btn" aria-label="Send message" title="Send">
        <span aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </span>
      </button>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
